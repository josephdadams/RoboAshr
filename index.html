<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#070b18">
<title>RoboAshr</title>
<style>
  :root {
    --brain: #ff8fb1; --brainLine: #d9577f; --led: #4df0ff; --ink: #eaf2ff;
  }
  .fuzzy { --led: #ffd23f; }
  .broken { --led: #ff4d6d; --brain: #8c8f99; --brainLine: #5d606b; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background-color: #070b18;
    background-image: radial-gradient(ellipse at 50% 30%, #1d4a9e, #0a1430 45%, #050816 75%);
    color: var(--ink);
    font-family: "Trebuchet MS", "Arial Rounded MT Bold", system-ui, sans-serif;
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  #app {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  }
  #meter { display: flex; align-items: center; gap: 10px; width: min(560px, 92vw); }
  #meter .ico { font-size: 32px; line-height: 1; }
  #meter .track { flex: 1; height: 24px; border-radius: 14px; background: #0b1224; border: 3px solid #33405f; overflow: hidden; }
  #fill { height: 100%; width: 100%; border-radius: 10px; background: #5be37a; }
  .fuzzy #meter .track { animation: pulse .6s ease-in-out infinite; }
  #robot { flex: 1; min-height: 0; width: 100%; max-width: 760px; }
  #bubble {
    font-size: clamp(20px, 3.6vw, 34px); font-weight: 700; text-align: center;
    padding: 8px 24px; border-radius: 999px; background: rgba(255,255,255,.08); max-width: 94vw;
  }
  .broken #bubble { background: #ff4d6d; color: #fff; animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .6; } }

  /* robot svg animation */
  #robotAll { transform-origin: 200px 520px; }
  .broken #robotAll { animation: wobble 1.4s ease-in-out infinite; }
  [data-state="talking"] #robotAll { animation: bob .18s ease-in-out infinite alternate; }
  .broken[data-state="talking"] #robotAll { animation: wobble .5s ease-in-out infinite; }
  @keyframes wobble { 0%,100% { transform: rotate(-3.5deg); } 50% { transform: rotate(3.5deg); } }
  @keyframes bob { to { transform: translateY(-5px); } }
  #headFx, #tapHint { display: none; }
  .broken #headFx { display: inline; }
  .broken #tapHint { display: inline; animation: nudge .8s ease-in-out infinite; }
  @keyframes nudge { 50% { transform: translateX(14px); } }
  .zz { animation: flick .3s steps(2, end) infinite; }
  .zz:nth-child(2) { animation-duration: .23s; }
  .zz:nth-child(3) { animation-duration: .37s; }
  @keyframes flick { 50% { opacity: 0; } }
  .smoke { animation: rise 2.2s linear infinite; transform-box: fill-box; transform-origin: center; opacity: 0; }
  .smoke:nth-of-type(2) { animation-delay: .7s; }
  .smoke:nth-of-type(3) { animation-delay: 1.4s; }
  @keyframes rise { 0% { transform: translate(0,0) scale(.5); opacity: .7; } 100% { transform: translate(12px,-70px) scale(2); opacity: 0; } }
  .fuzzy #domeBrain, .broken #domeBrain { animation: flicker .5s steps(2, end) infinite; }
  @keyframes flicker { 50% { opacity: .5; } }
  .tooth { fill: #f6f2e8; stroke: #cfc6b4; stroke-width: 1.5; }
  .fan { animation: spin .5s linear infinite; transform-origin: 0 0; }
  .broken .fan { animation-duration: 4s; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* overlays */
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 16px; }
  .hidden { display: none !important; }
  #start { z-index: 10; background-color: #070b18; background-image: radial-gradient(ellipse at 50% 40%, #213a66, #070b18 70%); text-align: center; }
  #start h1 { font-size: clamp(44px, 9vw, 96px); margin: 0; letter-spacing: 2px; }
  #start .big { height: clamp(150px, 32vh, 280px); width: auto; flex-shrink: 0; }
  #start p { margin: 0; font-size: clamp(16px, 2.6vw, 22px); opacity: .75; max-width: 34em; }
  #startBtn {
    font: inherit; font-size: clamp(28px, 5vw, 46px); font-weight: 800; padding: 22px 52px; border-radius: 999px; border: 0;
    background: linear-gradient(#5bf0ff, #2aa8d8); color: #06213a; cursor: pointer;
    box-shadow: 0 8px 0 #1a6f94, 0 14px 30px rgba(0,0,0,.45);
  }
  #startBtn:active { transform: translateY(6px); box-shadow: 0 2px 0 #1a6f94; }
  #repair { z-index: 5; background: rgba(4,7,18,.95); gap: 8px; }
  #repairTitle { font-size: clamp(28px, 5vw, 48px); font-weight: 900; margin: 0; }
  #todo { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .chip { font-size: clamp(20px, 3.5vw, 30px); font-weight: 800; padding: 6px 18px; border-radius: 999px; background: #1d2747; border: 3px solid #33405f; }
  .chip.done { background: #1f6e3a; border-color: #5be37a; }
  #repairSvg { flex: 1; min-height: 0; width: 100%; max-width: 680px; touch-action: none; }
  #repairSvg g { transform-origin: 0 0; }
  .loose { animation: jiggle .6s ease-in-out infinite; }
  @keyframes jiggle { 0%,100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }
  .boltTurn { transition: transform .25s cubic-bezier(.3,1.5,.5,1); }
  .spark { animation: sparkle .3s ease-in-out infinite alternate; }
  @keyframes sparkle { from { transform: scale(.8) rotate(0deg); } to { transform: scale(1.2) rotate(25deg); } }
  .ring { animation: pulse .9s ease-in-out infinite; }
  #fixedMsg {
    position: absolute; top: 40%; font-size: clamp(52px, 11vw, 110px); font-weight: 900; color: #5be37a; text-align: center;
    text-shadow: 0 6px 0 #0d3b1c, 0 0 40px rgba(91,227,122,.7); animation: pop .6s cubic-bezier(.2,1.6,.4,1);
    pointer-events: none;
  }
  @keyframes pop { from { transform: scale(.2); opacity: 0; } }
  .confetti { position: absolute; top: -24px; width: 14px; height: 20px; border-radius: 3px; animation: fall linear forwards; pointer-events: none; }
  @keyframes fall { to { transform: translateY(115vh) rotate(800deg); } }
  #zzz { display: none; }
  .asleep #zzz { display: inline; }
  .z { animation: zfloat 2.4s ease-in-out infinite; opacity: 0; }
  .z:nth-child(2) { animation-delay: .8s; }
  .z:nth-child(3) { animation-delay: 1.6s; }
  @keyframes zfloat { 0% { opacity: 0; transform: translateY(10px); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateY(-16px); } }
  .asleep .fan { animation-duration: 3s; }
  .asleep #meter { opacity: .45; }
  .dance #robotAll { animation: dance .35s ease-in-out infinite alternate; }
  @keyframes dance { from { transform: rotate(-6deg); } to { transform: rotate(6deg) translateY(-10px); } }
  #status { position: fixed; left: 8px; bottom: 8px; z-index: 20; font: 12px/1.3 ui-monospace, monospace; background: rgba(0,0,0,.6); padding: 4px 8px; border-radius: 6px; max-width: 60vw; }
  #debug input { font: inherit; font-size: 14px; padding: 5px 8px; width: 13em; }
  #debug { position: fixed; right: 8px; bottom: 8px; display: flex; gap: 6px; z-index: 20; }
  #debug button { font: inherit; font-size: 14px; padding: 6px 10px; }
</style>
</head>

<script>
'use strict';
const qs = new URLSearchParams(location.search);
const BRAIN_MS = (parseFloat(qs.get('minutes')) || 4) * 60000;
const PITCH = parseFloat(qs.get('pitch')) || 1.3;
const SENS = parseFloat(qs.get('sens')) || 1;
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs || {}) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const secs = () => performance.now() / 1000;

/* ---------------- state ---------------- */
let awake = false, broken = false, repairing = false;
let state = 'idle';            // idle | listening | talking
let brainMs = BRAIN_MS, warned30 = false, warned10 = false;
let happyUntil = 0;
let micOk = false, micMsg = '', micLevel = 0;
let playing = false, speaking = false, cooldownUntil = 0;
let recording = false, chunks = [], preRoll = [], silentSec = 0, voicedSec = 0, noiseFloor = 0.01;

let ac = null, master, sfxBus, voiceBus, outAnalyser, freqData, noiseBuf, proc, micStream;

function setState(s) { state = s; document.body.dataset.state = s; updateBubble(); }
function updateBubble() {
  const b = $('bubble');
  let t = '';
  if (bubbleMsg) t = bubbleMsg;
  else if (asleep) t = 'Zzz… wave at me to wake me up 👋';
  else if (broken) t = state === 'talking' ? '' : 'Uh oh! My brain broke! Tap it to fix! 🔧';
  else if (!micOk) t = micMsg || "I can't hear you! 🙉";
  else if (state === 'idle') t = rec ? 'Say "Robo…" to ask me things, or talk and I\'ll copy you! 🎤' : "Say something! I'll copy you 🎤";
  else if (state === 'listening') t = 'Listening… 👂';
  b.textContent = t;
  b.style.visibility = t ? 'visible' : 'hidden';
}
let bubbleMsg = '', bubbleTimer = 0, talkUntil = 0;
function showMsg(text, sec) {
  bubbleMsg = text;
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(() => { bubbleMsg = ''; updateBubble(); }, sec * 1000);
  updateBubble();
}

/* ---------------- audio setup ---------------- */
function initAudio() {
  ac = new (window.AudioContext || window.webkitAudioContext)();
  master = ac.createDynamicsCompressor();

    if (asleep && awake && !speaking && rms > startT * 2) noteActivity();   // talking wakes it up
    if (recording) { recording = false; chunks = []; if (state === 'listening') setState('idle'); }
    preRoll = [];

    face.tx = rand(-14, 14); face.ty = rand(-10, 10);

  }

  $('pupilL').setAttribute('transform', `translate(${lx.toFixed(1)},${ly.toFixed(1)}) scale(${sc})`);
  $('pupilR').setAttribute('transform', `translate(${rx.toFixed(1)},${ry.toFixed(1)}) scale(${sc})`);

  if (t > face.nextBlink) { face.blinkStart = t; face.nextBlink = t + rand(2, 6); }
  const bp = (t - face.blinkStart) / 0.16;
  const blink = (bp >= 0 && bp < 1) ? (1 - Math.abs(bp * 2 - 1)) * 88 : 0;
  $('lidL').setAttribute('height', asleep ? 88 : Math.max(blink, broken ? 34 : 0));
  $('lidR').setAttribute('height', asleep ? 88 : blink);
  const low = happy ? 30 : 0;
  for (const id of ['lowL', 'lowR']) { $(id).setAttribute('y', 44 - low); $(id).setAttribute('height', low); }

    outAnalyser.getByteFrequencyData(freqData);

let last = performance.now();
function frame(now) {

  if (awake && camOk && !asleep && !repairing && !playing && !speaking && !recording &&
      now - lastActivity > AWAY_MS) goToSleep();
  if (awake && !broken && !repairing && !asleep) {

    if (brainMs <= warnAt && !warned30) { warned30 = true; sfx.warn(); say('My brain is getting fuzzy!'); }
    if (brainMs <= 10000 && !warned10) { warned10 = true; sfx.warn(); }

// Nothing is recorded or uploaded: tiny 64x48 frames are compared to the one before and thrown away.
const NAME = (qs.get('name') || '').trim();
const AWAY_MS = (parseFloat(qs.get('away')) || 45) * 1000;
const MOTION_T = parseFloat(qs.get('motion')) || 0.02;
let asleep = false, camOk = false, camVideo = null, camCtx = null, prevFrame = null, motionLevel = 0;
let lastActivity = performance.now();
const hi = () => NAME ? `Hi ${NAME}!` : 'Hi there!';

async function initCamera() {
  if (qs.get('camera') === 'off' || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
  try {
    const s = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 160 }, height: { ideal: 120 }, frameRate: { ideal: 10 } }
    });

    camVideo.srcObject = s;

    let changed = 0;
    for (let i = 0; i < n; i++) if (Math.abs(g[i] - prevFrame.g[i] - shift) > 22) changed++;

  if (asleep) { noteActivity(); return; }
  noteActivity();
  const isQuestion = hasWake(txt) || secs() < followUpUntil;
  if (pending) {
    const p = pending; pending = null; clearTimeout(p.timer);
    if (isQuestion) answer(txt);
    else if (micStarved) mimicText(txt);
    else playVoice(p.buf);
    return;
  }
  if (isQuestion) { answer(txt); return; }        // also cancels any recording in progress
  if (micStarved) { mimicText(txt); return; }
  lastFinal = { txt, at: secs() };                // the recording of this is probably still finishing
}

// called when the copy-recorder has a finished sentence
function heardAudio(buf) {
  if (!rec) { playVoice(buf); return; }
  if (lastFinal && lastFinal.at >= recStartAt - 0.3) { lastFinal = null; playVoice(buf); return; }
  flushSpeech();                                   // Vosk: "what was that?" right now
  const wait = interimWake ? 3000 : 1500;          // give the recognizer a moment to tell us what it was
  pending = {
    buf,
    timer: setTimeout(() => {
      if (!pending) return;
      const b = pending.buf; pending = null;
      if (interimWake) { interimWake = false; setState('idle'); return; }
      playVoice(b);
    }, wait)
  };
}

// if the recognizer hogs the microphone (some Android tablets), copy with the robot's own voice instead
function mimicText(txt) { say(txt, null, 2); }

function answer(txt) {
  interimWake = false; followUpUntil = 0; lastFinal = null;
  if (pending) { clearTimeout(pending.timer); pending = null; }
  recording = false; chunks = [];
  const q = stripWake(txt).toLowerCase().replace(/[^a-z0-9+\-*/ .']/g, ' ').replace(/\s+/g, ' ').trim();
  const r = broken ? brokenReply() : reply(q);
  setState('idle');
  tone(1200, .06, { type: 'triangle', vol: .08 });
  tone(1600, .06, { type: 'triangle', vol: .08, delay: .08 });
  setTimeout(() => {
    if (r.act) r.act();
    const done = () => {
      if (r.after) r.after();
      if (r.followUp) followUpUntil = secs() + 7;
    };
    if (r.text) say(r.text, done); else done();
  }, 250);
}

function reply(q) {
  const has = (...w) => w.some(x => q.includes(x));
  const word = re => re.test(q);
  if (!q) return { text: pick(["Yes? Ask me anything!", "Beep boop! I'm listening!", 'What do you want to know?']), followUp: true };

  const m = q.match(/(-?\d+(?:\.\d+)?|[a-z]+) ?(plus|\+|minus|-|times|x|\*|multiplied by|divided by|\/|over) ?(-?\d+(?:\.\d+)?|[a-z]+)/);
  if (m) {
    const a = num(m[1]), b = num(m[3]);
    if (a !== undefined && b !== undefined) {
      const op = m[2];
      let r, word;
      if (op === 'plus' || op === '+') { r = a + b; word = 'plus'; }
      else if (op === 'minus' || op === '-') { r = a - b; word = 'minus'; }
      else if (op === 'divided by' || op === '/' || op === 'over') {
        if (b === 0) return { text: "Dividing by zero makes my brain go bonkers! Don't do that!" };
        r = a / b; word = 'divided by';
      } else { r = a * b; word = 'times'; }
      return { text: `${a} ${word} ${b} is ${Math.round(r * 100) / 100}!` };
    }
  }
  if (has('joke')) return { text: pick(JOKES), act: () => setTimeout(sfx.giggle, 2500) };
  if (has('fact', 'tell me something')) return { text: pick(FACTS) };
  const sp = q.match(/(?:what does|what do|what sound does|how does) (?:a |an |the )?([a-z]+)/);
  if (sp && SOUNDS[sp[1].replace(/s$/, '')]) return { text: SOUNDS[sp[1].replace(/s$/, '')] };
  const say2 = q.match(/^(?:say|repeat after me) (.+)/);
  if (say2) return { text: say2[1] };
  const sp2 = q.match(/spell (?:the word )?([a-z]+)/);
  if (sp2) return { text: sp2[1].toUpperCase().split('').join(', ') + '. ' + sp2[1] + '!' };
  const ct = q.match(/count to ([a-z0-9]+)/);
  if (ct && num(ct[1])) {
    const n = Math.min(20, Math.max(1, Math.floor(num(ct[1]))));
    return { text: Array.from({ length: n }, (_, i) => i + 1).join(', ') + '! Beep!' };
  }
  if (has('what time', 'the time')) return { text: `It's ${new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}!` };
  if (has('what day', 'today', 'the date', "what's the date")) return { text: `Today is ${new Date().toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' })}!` };
  if (has('your name', 'who are you')) return { text: "I'm RoboAshr! A robot with a brain in a jar!" };
  if (has('how old')) return { text: "I'm a brand new robot! I was built in 2026." };
  if (has('how are you', "how's it going", 'how do you feel')) {
    const p = brainMs / BRAIN_MS;

  }
  if (has('brain')) return { text: `My brain has ${Math.round(brainMs / BRAIN_MS * 100)} percent power left!` };
  if (has('dance')) return { text: "Let's dance! Beep boop beep!", act: robotDance };
  if (word(/\bsing\b|\bsong/)) return { act: robotSing };
  if (has('flip a coin', 'coin')) return { text: `Flipping... it's ${pick(['heads', 'tails'])}!` };
  if (has('dice', 'a die')) return { text: `Rolling... you got a ${randi(1, 6)}!` };
  if (has('pick a number', 'random number')) return { text: `How about ${randi(1, 10)}?` };
  if (has('love you')) return { text: `I love you too${NAME ? ', ' + NAME : ''}! Beep boop!`, act: () => { happyUntil = secs() + 3; } };
  if (has('best friend')) return { text: NAME ? `You are, ${NAME}!` : 'You are!', act: () => { happyUntil = secs() + 3; } };
  if (has('favorite color')) return { text: 'Blue! Like my spotlight!' };
  if (has('favorite food', 'what do you eat', 'hungry')) return { text: 'I eat electricity! It tastes like tingly lemonade.' };
  if (has('weather', 'raining', 'sunny')) return { text: "I can't see outside! Can you look out the window and tell me?" };
  if (has('are you real', 'are you a robot', 'are you alive')) return { text: "I'm a real robot! Well, a robot who lives in a tablet." };
  if (has('go to sleep', 'goodnight', 'good night') || word(/\bnap\b/)) return { text: 'Okay, goodnight! Zzz.', after: goToSleep };
  if (has('laugh', 'tickle')) return { text: 'Ha ha ha! Beep beep! That tickles!', act: sfx.giggle };
  if (has('scare me', 'scary') || word(/\bboo\b/)) return { text: 'BOO! Ha ha! Did I scare you?' };
  if (has('sneeze')) return { text: 'Ah... ah... ah-CHOO! Oops, I sneezed out a bolt.' };
  if (has('burp')) return { text: 'Bzzzzrrrrp! Excuse me!', act: () => tone(90, .6, { type: 'sawtooth', vol: .12, slide: 60 }) };
  if (has('fart', 'toot')) return { text: 'Pfffrrrt! Oops, that was my exhaust fan!', act: () => noise(.5, { vol: .2, hp: 80 }) };
  if (has('copy me', 'copy what', 'repeat me')) return { text: "Okay! Just talk, and I'll copy you!" };
  if (has('what can you do', 'help')) return { text: 'Ask me for a joke, a fact, the time, some math, an animal sound, or tell me to dance or sing!' };
  if (has('thank')) return { text: "You're welcome! Beep boop!" };

const rs = $('repairSvg');
let R = null, crackleTimer = 0;
const WIRE_COLORS = [['#ff4d4d', '#8f1d1d'], ['#ffd23f', '#8a6a00'], ['#4da6ff', '#1d4f8f']];

function svgPoint(e) {
  const p = rs.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
  return p.matrixTransform(rs.getScreenCTM().inverse());
}
function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function mix(a, b, t) { const A = hex2rgb(a), B = hex2rgb(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',')})`; }

function openRepair() {
  repairing = true;
  try { speechSynthesis.cancel(); } catch (e) {}
  speaking = false;
  $('repair').classList.remove('hidden');
  buildRepair();
  crackleTimer = setInterval(() => { if (R && R.left.sparks > 0) sfx.crackle(); }, 1100);
}

function closeRepair() {
  clearInterval(crackleTimer);
  $('repair').classList.add('hidden');
  rs.innerHTML = '';
  broken = false; repairing = false;
  document.body.classList.remove('broken');
  brainMs = BRAIN_MS; warned30 = false; warned10 = false;
  happyUntil = secs() + 2.5;

function buildRepair() {
  rs.innerHTML = '';
  const types = shuffle(['sparks', 'bolts', 'wires']).slice(0, randi(2, 3));
  const n = {
    sparks: types.includes('sparks') ? randi(3, 5) : 0,
    bolts: types.includes('bolts') ? randi(2, 4) : 0,
    wires: types.includes('wires') ? randi(1, 3) : 0
  };
  R = { left: { ...n }, total: n.sparks + n.bolts + n.wires, fixed: 0, drag: null, done: false };

  // panel
  el('rect', { x: 8, y: 8, width: 384, height: 424, rx: 30, fill: 'url(#metal)', stroke: '#3b4560', 'stroke-width': 4 }, rs);
  el('rect', { x: 28, y: 28, width: 344, height: 384, rx: 20, fill: '#18203a' }, rs);
  const deco = el('g', { fill: 'none', stroke: '#26304f', 'stroke-width': 4, 'stroke-linecap': 'round' }, rs);
  ['M40,230 H80 V270 H120', 'M360,230 H320 V260 H290', 'M60,120 H85', 'M340,120 H315', 'M150,410 V395 H250 V410'].forEach(d => el('path', { d }, deco));
  const label = el('text', { x: 200, y: 425, 'text-anchor': 'middle', 'font-size': 11, fill: '#5d6886', 'font-weight': 700 }, rs);
  label.textContent = 'ROBO-BRAIN 3000';

  const brain = el('use', { href: '#brainShape', x: 90, y: 50, width: 220, height: 156 }, rs);
  R.brain = brain;
  paintBrain();

  const wireLayer = el('g', {}, rs), sockLayer = el('g', {}, rs), plugLayer = el('g', {}, rs);
  const sparkLayer = el('g', {}, rs), boltLayer = el('g', {}, rs);
  R.fx = el('g', {}, rs);

  /* bolts in the corners */
  const corners = shuffle([[54, 54], [346, 54], [54, 386], [346, 386]]);
  corners.forEach(([x, y], i) => makeBolt(boltLayer, x, y, i < n.bolts));

  /* sparks on the brain */
  const pts = [];
  while (pts.length < n.sparks) {
    const a = rand(0, Math.PI * 2), r = Math.sqrt(Math.random());
    const p = [200 + Math.cos(a) * r * 82, 128 + Math.sin(a) * r * 52];
    if (pts.every(q => Math.hypot(q[0] - p[0], q[1] - p[1]) > 50) || pts.length > 40) pts.push(p);
  }
  pts.forEach(p => makeSpark(sparkLayer, p[0], p[1]));

  /* wires: plug each one into the matching color */
  if (n.wires) {
    const cols = shuffle(WIRE_COLORS.slice()).slice(0, n.wires);
    const sockX = shuffle([110, 200, 290]).slice(0, n.wires);
    const plugX = shuffle([120, 200, 280]).slice(0, n.wires);
    R.sockets = [];
    R.wires = cols.map((c, k) => {
      const ax = 200 + (k - (n.wires - 1) / 2) * 44;
      const sock = { x: sockX[k], y: 300, color: c[0] };
      R.sockets.push(sock);
      const sg = el('g', { transform: `translate(${sock.x},${sock.y})` }, sockLayer);
      sock.ring = el('circle', { r: 32, fill: 'none', stroke: c[0], 'stroke-width': 4, class: 'ring', opacity: .6 }, sg);
      el('circle', { r: 22, fill: '#0b1020', stroke: c[0], 'stroke-width': 7 }, sg);
      el('rect', { x: -8, y: -4, width: 5, height: 10, rx: 2, fill: '#000' }, sg);
      el('rect', { x: 3, y: -4, width: 5, height: 10, rx: 2, fill: '#000' }, sg);
      const w = { color: c[0], dark: c[1], ax, ay: 192, sx: plugX[k], sy: 372 + rand(-6, 6), done: false };
      w.x = w.sx; w.y = w.sy;
      w.path = el('path', { fill: 'none', stroke: c[0], 'stroke-width': 9, 'stroke-linecap': 'round' }, wireLayer);
      w.g = el('g', {}, plugLayer);
      el('circle', { r: 36, fill: 'transparent' }, w.g);
      el('rect', { x: -7, y: 14, width: 4, height: 10, rx: 1, fill: '#d0d6e2' }, w.g);
      el('rect', { x: 3, y: 14, width: 4, height: 10, rx: 1, fill: '#d0d6e2' }, w.g);
      el('rect', { x: -14, y: -16, width: 28, height: 32, rx: 7, fill: c[0], stroke: c[1], 'stroke-width': 3 }, w.g);
      el('rect', { x: -8, y: -10, width: 16, height: 5, rx: 2, fill: c[1], opacity: .6 }, w.g);
      w.g.addEventListener('pointerdown', e => {
        if (w.done || R.done) return;
        e.preventDefault();
        R.drag = { w, id: e.pointerId };
        rs.setPointerCapture(e.pointerId);
        plugLayer.appendChild(w.g);
        tone(500, .05, { type: 'triangle', vol: .08 });
      });
      drawWire(w);
      return w;
    });
  }
  updateTodo();
}

function paintBrain() {
  const t = R.total ? R.fixed / R.total : 1;
  R.brain.style.setProperty('--brain', mix('#8c8f99', '#ff8fb1', t));
  R.brain.style.setProperty('--brainLine', mix('#5d606b', '#d9577f', t));
}

function drawWire(w) {
  w.path.setAttribute('d', `M${w.ax},${w.ay} C${w.ax},${w.ay + 90} ${w.x},${w.y - 100} ${w.x},${w.y - 14}`);
  w.g.setAttribute('transform', `translate(${w.x.toFixed(1)},${w.y.toFixed(1)})`);
}

rs.addEventListener('pointermove', e => {
  if (!R || !R.drag || R.drag.id !== e.pointerId) return;
  const p = svgPoint(e), w = R.drag.w;
  w.x = clamp(p.x, 30, 370);
  w.y = clamp(p.y - 22, 40, 400);   // keep plug above the finger
  drawWire(w);
});
function endDrag(e) {
  if (!R || !R.drag || R.drag.id !== e.pointerId) return;
  const w = R.drag.w; R.drag = null;
  let best = null, bd = 48;
  for (const s of R.sockets) {
    if (s.taken) continue;
    const d = Math.hypot(s.x - w.x, s.y - (w.y + 12));
    if (d < bd) { bd = d; best = s; }
  }
  if (!best) return;
  if (best.color === w.color) {
    best.taken = true; w.done = true;
    w.x = best.x; w.y = best.y - 12;
    drawWire(w);
    best.ring.remove();
    sfx.plug();
    burst(best.x, best.y, w.color);
    fixedOne('wires');
  } else {
    sfx.buzz();
    w.x = w.sx; w.y = w.sy;
    drawWire(w);
  }
}
rs.addEventListener('pointerup', endDrag);
rs.addEventListener('pointercancel', endDrag);

function makeBolt(layer, x, y, loose) {
  const outer = el('g', { transform: `translate(${x},${y})` }, layer);
  const wig = el('g', { class: loose ? 'loose' : '' }, outer);
  const inner = el('g', { class: 'boltTurn' }, wig);
  const shadow = el('circle', { cx: 4, cy: 6, r: 22, fill: 'rgba(0,0,0,.35)' }, inner);
  const hex = [];
  for (let i = 0; i < 6; i++) { const a = Math.PI / 3 * i; hex.push((Math.cos(a) * 20).toFixed(1) + ',' + (Math.sin(a) * 20).toFixed(1)); }
  el('polygon', { points: hex.join(' '), fill: '#d7dde8', stroke: '#6b7590', 'stroke-width': 3 }, inner);
  el('circle', { r: 9, fill: '#aab3c5' }, inner);
  el('path', { d: 'M-6,0 H6 M0,-6 V6', stroke: '#5d6886', 'stroke-width': 3, 'stroke-linecap': 'round' }, inner);
  if (!loose) { shadow.remove(); inner.style.transform = 'scale(.8)'; return; }
  const ring = el('circle', { r: 32, fill: 'none', stroke: '#ffd23f', 'stroke-width': 4, 'stroke-dasharray': '8 6', class: 'ring' }, outer);
  el('circle', { r: 38, fill: 'transparent' }, outer);
  let turns = 3, rot = rand(10, 50);
  const apply = () => { inner.style.transform = `rotate(${rot}deg) scale(${(1 + turns * 0.14).toFixed(2)})`; };
  apply();
  outer.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (turns <= 0 || R.done) return;
    turns--; rot += 120; apply();
    sfx.ratchet();
    if (turns === 0) {
      wig.classList.remove('loose'); ring.remove(); shadow.remove();
      burst(x, y, '#5be37a');
      fixedOne('bolts');
    }
  });
}

function makeSpark(layer, x, y) {
  const outer = el('g', { transform: `translate(${x.toFixed(1)},${y.toFixed(1)})` }, layer);
  const inner = el('g', { class: 'spark' }, outer);
  inner.style.animationDelay = rand(0, .3).toFixed(2) + 's';
  el('circle', { r: 22, fill: '#ffe14d', opacity: .3 }, inner);
  const pts = [];
  for (let i = 0; i < 16; i++) { const a = Math.PI / 8 * i, r = i % 2 ? 8 : 20; pts.push((Math.cos(a) * r).toFixed(1) + ',' + (Math.sin(a) * r).toFixed(1)); }
  el('polygon', { points: pts.join(' '), fill: '#fff36b', stroke: '#ff9f1c', 'stroke-width': 2.5, 'stroke-linejoin': 'round' }, inner);
  el('circle', { r: 32, fill: 'transparent' }, outer);
  let gone = false;
  outer.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (gone || R.done) return;
    gone = true;
    sfx.zap();
    burst(x, y, '#fff36b');
    outer.remove();
    fixedOne('sparks');
  });
}

function burst(x, y, color) {
  for (let i = 0; i < 10; i++) {
    const a = Math.PI * 2 * i / 10 + rand(-.2, .2), d = rand(30, 60);
    const c = el('circle', { cx: x, cy: y, r: rand(3, 6), fill: color }, R.fx);
    const anim = c.animate(
      [{ transform: 'translate(0,0)', opacity: 1 }, { transform: `translate(${Math.cos(a) * d}px,${Math.sin(a) * d}px)`, opacity: 0 }],
      { duration: 500, easing: 'ease-out' });
    anim.onfinish = () => c.remove();
  }
}

function fixedOne(type) {
  R.left[type]--; R.fixed++;
  paintBrain();
  updateTodo();
  if (R.fixed >= R.total) win();
}

function updateTodo() {
  const icons = { sparks: '⚡', bolts: '🔩', wires: '🔌' };
  $('todo').innerHTML = '';
  for (const k of ['sparks', 'bolts', 'wires']) {
    if (R.left[k] === 0 && !R['had_' + k]) continue;
    R['had_' + k] = true;
    const d = document.createElement('div');
    d.className = 'chip' + (R.left[k] === 0 ? ' done' : '');
    d.textContent = icons[k] + ' ' + (R.left[k] === 0 ? '✓' : R.left[k]);
    $('todo').appendChild(d);
  }
}

function win() {
  R.done = true;
  clearInterval(crackleTimer);
  sfx.fanfare();
  const msg = document.createElement('div');
  msg.id = 'fixedMsg'; msg.textContent = 'Brain fixed! 🎉';
  $('repair').appendChild(msg);
  const colors = ['#ff4d6d', '#ffd23f', '#4da6ff', '#5be37a', '#ff8fb1', '#b38cff'];
  for (let i = 0; i < 70; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = rand(0, 100) + 'vw';
    c.style.background = colors[i % colors.length];
    c.style.animationDuration = rand(1.6, 3) + 's';
    c.style.animationDelay = rand(0, .5) + 's';
    $('repair').appendChild(c);
  }
  setTimeout(() => {
    document.querySelectorAll('#repair .confetti, #fixedMsg').forEach(n => n.remove());
    closeRepair();
  }, 2800);
}

/* ---------------- wake up ---------------- */
let wakeLock = null;
async function keepAwake() { try { if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {} }
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && awake) { keepAwake(); if (ac) ac.resume(); }
});

$('startBtn').addEventListener('click', async () => {
  $('startBtn').disabled = true;
  try { const r = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); if (r && r.catch) r.catch(() => {}); } catch (e) {}
  try { initAudio(); ac.resume(); } catch (e) { $('startErr').textContent = 'Sound is not supported on this browser.'; $('startBtn').disabled = false; return; }
  keepAwake();
  await initMic();
  initSpeech();
  initCamera();
  lastActivity = performance.now();
  awake = true;
  $('start').classList.add('hidden');
  sfx.boot();
  happyUntil = secs() + 1.5;
  setState('idle');
});

/* ---------------- grown-up test hooks: add ?debug to the URL ---------------- */
window.robot = {
  breakNow() { brainMs = 1; },
  fix() { if (repairing) win(); },
  testVoice(sec = 1.2) {
    const sr = ac.sampleRate, b = ac.createBuffer(1, sr * sec, sr), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) {
      const t = i / sr, f = 160 + 40 * Math.sin(t * 6);
      d[i] = (Math.sin(2 * Math.PI * f * t) + .5 * Math.sin(4 * Math.PI * f * t) + .3 * Math.sin(6 * Math.PI * f * t)) * Math.abs(Math.sin(t * 9)) * .3;
    }
    playVoice(b);
  }
};
if (qs.has('debug')) {
  const dbg = document.createElement('div'); dbg.id = 'debug';
  [['Break brain', () => robot.breakNow()], ['Test voice', () => robot.testVoice()], ['Fix', () => robot.fix()]].forEach(([l, f]) => {
    const b = document.createElement('button'); b.textContent = l; b.onclick = f; dbg.appendChild(b);
  });
  const ask = document.createElement('input');
  ask.placeholder = 'Type: robo tell me a joke';
  ask.onkeydown = e => { if (e.key === 'Enter' && ask.value.trim()) { gotFinal(ask.value.trim()); ask.value = ''; } };
  dbg.prepend(ask);
  [['Sleep', () => goToSleep()], ['Wake', () => noteActivity()]].forEach(([l, f]) => {
    const b = document.createElement('button'); b.textContent = l; b.onclick = f; dbg.appendChild(b);
  });
  document.body.appendChild(dbg);
  const st = document.createElement('div'); st.id = 'status';
  document.body.appendChild(st);
  setInterval(() => {
    st.textContent = `mic ${micOk ? '✓' : '✗'}${micStarved ? ' (taken by speech)' : ''} · camera ${camOk ? '✓' : '✗'} motion ${(motionLevel * 100).toFixed(1)}% · ` +
      `speech: ${srStatus} · voice ${'speechSynthesis' in window ? '✓' : '✗'} · heard: "${heardLog}"`;
  }, 300);
}
updateBubble();
</script>
